name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/install.sh
      - name: Staging install
        run: DESTDIR="$RUNNER_TEMP/fish-stage" bash scripts/install.sh
  astrbot-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install aiohttp
      - run: python -m compileall -q integrations/astrbot
      - run: python -m unittest discover -s integrations/astrbot/tests -v
